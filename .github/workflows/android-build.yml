name: Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode keystore from GitHub Secrets
        env:
          AETHER_KEYSTORE_BASE64: ${{ secrets.AETHER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AETHER_KEYSTORE_BASE64" ]; then
            echo "$AETHER_KEYSTORE_BASE64" | base64 -d > aether.keystore
            echo "Keystore restored for CI signing"
          else
            echo "No AETHER_KEYSTORE_BASE64 secret — unsigned/debug-aligned release"
          fi

      - name: Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Assemble release
        env:
          AETHER_STORE_PASSWORD: ${{ secrets.AETHER_STORE_PASSWORD }}
          AETHER_KEY_PASSWORD: ${{ secrets.AETHER_KEY_PASSWORD }}
          AETHER_KEY_ALIAS: ${{ secrets.AETHER_KEY_ALIAS }}
          AETHER_KEYSTORE_PATH: aether.keystore
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Scrub keystore from runner
        if: always()
        run: rm -f aether.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: aether-link-apk
          path: android/app/build/outputs/apk/release/*.apk
