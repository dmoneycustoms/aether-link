name: Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode keystore from GitHub Secrets (optional)
        env:
          AETHER_KEYSTORE_BASE64: ${{ secrets.AETHER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AETHER_KEYSTORE_BASE64" ]; then
            echo "$AETHER_KEYSTORE_BASE64" | base64 -d > aether.keystore
            echo "release keystore ready"
          else
            echo "No release secrets — will ship debug-signed APK for sideload"
          fi

      - name: Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      # Always produce an installable APK (Android debug keystore)
      - name: Assemble debug (always installable)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Assemble release (if secrets present)
        env:
          AETHER_STORE_PASSWORD: ${{ secrets.AETHER_STORE_PASSWORD }}
          AETHER_KEY_PASSWORD: ${{ secrets.AETHER_KEY_PASSWORD }}
          AETHER_KEY_ALIAS: ${{ secrets.AETHER_KEY_ALIAS }}
          AETHER_KEYSTORE_PATH: aether.keystore
        run: |
          if [ -f aether.keystore ] && [ -n "$AETHER_STORE_PASSWORD" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "Skip release signing — install the debug APK artifact instead"
          fi

      - name: Scrub keystore
        if: always()
        run: rm -f aether.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: aether-link-apk-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aether-link-apk-release
          path: android/app/build/outputs/apk/release/*.apk
        continue-on-error: true
